# Taint rules (no framework model). Family prefix: tpy- Python, tjs- JS/TS, tphp- PHP.
# Class = id after the prefix (sqli, cmdi, ...). Sources/sinks: docs/spec.md section 7.
rules:
- id: tpy-sqli
  kind: taint
  stack: generic
  languages: &id001
  - python
  severity: high
  confidence: medium
  cwe:
  - CWE-89
  owasp: A03:2021
  title: SQL injection (tainted data reaches a query)
  message: Untrusted input flows into a SQL statement without parameter binding.
  sources: &id002
  - field *request.args
  - field *request.form
  - field *request.GET
  - field *request.POST
  - field *request.json
  - field *request.values
  - field *request.data
  - field *request.cookies
  - field *request.headers
  - field *request.files
  - call input
  - field sys.argv
  sinks:
  - call *.execute arg0
  - call *.executemany arg0
  - call *.raw arg0
  - call text arg0
  - call RawSQL arg0
  - call *.read_sql arg0
  sanitizers:
  - call int
  - call float
  - call bool
  supersedes:
  - py-sql-execute-interp
  fix: Use parameterised queries / bound parameters.
  tests:
    vulnerable:
    - vuln.py
    safe:
    - safe.py
- id: tpy-cmdi
  kind: taint
  stack: generic
  languages: *id001
  severity: critical
  confidence: medium
  cwe:
  - CWE-78
  owasp: A03:2021
  title: OS command injection (tainted data reaches a shell)
  message: Untrusted input flows into an OS command.
  sources: *id002
  sinks:
  - call os.system arg0
  - call os.popen arg0
  - call subprocess.getoutput arg0
  - call subprocess.getstatusoutput arg0
  - call commands.getoutput arg0
  sanitizers:
  - call int
  - call shlex.quote
  - call pipes.quote
  supersedes:
  - py-os-system
  fix: Avoid the shell; pass an argument list and validate input.
  tests:
    vulnerable:
    - vuln.py
    safe:
    - safe.py
- id: tpy-codei
  kind: taint
  stack: generic
  languages: *id001
  severity: critical
  confidence: medium
  cwe:
  - CWE-95
  owasp: A03:2021
  title: Code injection (tainted data reaches eval)
  message: Untrusted input flows into dynamic code evaluation.
  sources: *id002
  sinks:
  - call eval arg0
  - call exec arg0
  - call compile arg0
  sanitizers:
  - call int
  - call float
  - call ast.literal_eval
  supersedes:
  - py-eval
  - py-exec
  fix: Never evaluate user input; use a parser or a fixed lookup.
  tests:
    vulnerable:
    - vuln.py
    safe:
    - safe.py
- id: tpy-pathtrav
  kind: taint
  stack: generic
  languages: *id001
  severity: high
  confidence: medium
  cwe:
  - CWE-22
  owasp: A03:2021
  title: Path traversal (tainted data reaches a file path)
  message: Untrusted input flows into a file system path.
  sources: *id002
  sinks:
  - call open arg0
  - call send_file arg0
  - call send_from_directory arg1
  - call os.remove arg0
  - call os.unlink arg0
  - call shutil.copy arg0
  - call os.listdir arg0
  - call FileResponse arg0
  sanitizers:
  - call os.path.basename
  - call secure_filename
  - call werkzeug.utils.secure_filename
  - call int
  fix: Use a fixed base directory, reduce input to a basename and verify the resolved path.
  tests:
    vulnerable:
    - vuln.py
    safe:
    - safe.py
- id: tpy-ssrf
  kind: taint
  stack: generic
  languages: *id001
  severity: high
  confidence: medium
  cwe:
  - CWE-918
  owasp: A10:2021
  title: SSRF (tainted data reaches an outgoing request)
  message: Untrusted input flows into the URL of a server-side request.
  sources: *id002
  sinks:
  - call requests.get arg0
  - call requests.post arg0
  - call requests.put arg0
  - call requests.delete arg0
  - call requests.head arg0
  - call requests.request arg1
  - call urllib.request.urlopen arg0
  - call urlopen arg0
  - call httpx.get arg0
  - call httpx.post arg0
  sanitizers:
  - call int
  fix: Allow-list hosts and schemes; never request user-supplied URLs directly.
  tests:
    vulnerable:
    - vuln.py
    safe:
    - safe.py
- id: tpy-deser
  kind: taint
  stack: generic
  languages: *id001
  severity: high
  confidence: medium
  cwe:
  - CWE-502
  owasp: A03:2021
