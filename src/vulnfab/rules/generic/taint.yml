    safe:
    - safe.py
- id: tpy-xss
  kind: taint
  stack: generic
  languages: *id001
  severity: medium
  confidence: medium
  cwe:
  - CWE-79
  owasp: A03:2021
  title: Cross-site scripting (tainted data reaches HTML output)
  message: Untrusted input flows into HTML output without escaping.
  sources: *id002
  sinks:
  - call Markup arg0
  - call mark_safe arg0
  - call HttpResponse arg0
  sanitizers:
  - call escape
  - call html.escape
  - call markupsafe.escape
