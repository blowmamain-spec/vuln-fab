# Taint rules (no framework model). Family prefix: tpy- Python, tjs- JS/TS, tphp- PHP.
# Class = id after the prefix (sqli, cmdi, ...). Sources/sinks: docs/spec.md section 7.
rules:
- id: tpy-sqli
  kind: taint
  stack: generic
  languages: &id001
  - python
  severity: high
  confidence: medium
  cwe:
  - CWE-89
  owasp: A03:2021
  title: SQL injection (tainted data reaches a query)
  message: Untrusted input flows into a SQL statement without parameter binding.
  sources:
  - field *request.args
  - field *request.form
  - field *request.GET
  - field *request.POST
  - field *request.json
  - field *request.values
  - field *request.data
  - field *request.cookies
  - field *request.headers
  - field *request.files
  - call input
  - field sys.argv
  sinks:
  - call *.execute arg0
  - call *.executemany arg0
  - call *.raw arg0
  - call text arg0
  - call RawSQL arg0
  - call *.read_sql arg0
  sanitizers:
  - call int
  - call float
  - call bool
  validators:
  - call re.match
  - call re.fullmatch
  - call *.isdigit
  - call *.isalnum
  - call *.isnumeric
  - call *.fullmatch
  supersedes:
  - py-sql-execute-interp
  fix: Use parameterised queries / bound parameters.
  tests:
    vulnerable:
    - vuln.py
    safe:
    - safe.py
- id: tpy-cmdi
  kind: taint
  stack: generic
  languages: *id001
  severity: critical
  confidence: medium
  cwe:
  - CWE-78
  owasp: A03:2021
  title: OS command injection (tainted data reaches a shell)
  message: Untrusted input flows into an OS command.
  sources:
  - field *request.args
  - field *request.form
  - field *request.GET
  - field *request.POST
  - field *request.json
  - field *request.values
  - field *request.data
  - field *request.cookies
  - field *request.headers
  - field *request.files
  - call input
  - field sys.argv
  sinks:
  - call os.system arg0
  - call os.popen arg0
  - call subprocess.getoutput arg0
  - call subprocess.getstatusoutput arg0
  - call commands.getoutput arg0
  sanitizers:
  - call int
  - call shlex.quote
  - call pipes.quote
  validators:
  - call re.match
  - call re.fullmatch
  - call *.isdigit
  - call *.isalnum
  - call *.isnumeric
  - call *.fullmatch
  supersedes:
  - py-os-system
  fix: Avoid the shell; pass an argument list and validate input.
  tests:
    vulnerable:
    - vuln.py
    safe:
    - safe.py
