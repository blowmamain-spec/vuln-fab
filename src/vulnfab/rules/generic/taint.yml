- id: tpy-idor
  kind: taint
  stack: generic
  languages: *id001
  severity: medium
  confidence: medium
  cwe:
  - CWE-639
  owasp: A01:2021
  title: Possible IDOR (request key fetches a record without ownership evidence)
  message: A record is fetched by a key taken from the request, and the function shows no sign of checking
    that the record belongs to the current user.
  sources:
  - field *request.args
  - field *request.form
  - field *request.GET
  - field *request.POST
  - field *request.json
  - field *request.values
  - field *request.data
  - field *request.cookies
  - field *request.headers
  - field *request.files
  - call input
  - field sys.argv
  - param pk
  - param id
  - param *_id
  - param *_pk
  sinks:
  - call *.query.get arg0
  - call *.query.get_or_404 arg0
  - call get_object_or_404 any
  - call *.objects.get kw:pk
  - call *.objects.get kw:id
  - call session.get arg1
  tier: B
  sanitizers:
  - call jwt.decode
  - call *.decode_token
  guards:
  - field *request.user
  - field current_user
  - field flask_login.current_user
  - field g.user
  - field *request.session
  - field session
  - call get_jwt_identity
  - call current_identity
  fix: Scope the query to the signed-in user (filter by owner) or compare the owner after loading.
  tests:
    vulnerable:
    - vuln.py
    safe:
    - safe.py
