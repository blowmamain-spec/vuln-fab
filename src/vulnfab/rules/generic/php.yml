rules:
  - id: php-eval
    stack: generic
    languages: [php]
    severity: high
    confidence: medium
    cwe: [CWE-95]
    owasp: "A03:2021"
    title: "Use of eval()"
    message: "eval() executes arbitrary code. Avoid it with non-constant input."
    pattern: "eval($X)"
    where:
      - {metavariable: X, kind: not_literal}
    tests: {vulnerable: [vuln.php], safe: [safe.php]}

  - id: php-unserialize
    stack: generic
    languages: [php]
    severity: high
    confidence: medium
    cwe: [CWE-502]
    owasp: "A08:2021"
    title: "unserialize() on possibly untrusted data"
    message: "unserialize can instantiate arbitrary classes (object injection)."
    pattern: "unserialize($X)"
    fix: "Use json_decode, or pass ['allowed_classes' => false]."
    tests: {vulnerable: [vuln.php], safe: [safe.php]}

  - id: php-exec-family
    stack: generic
    languages: [php]
    severity: high
    confidence: medium
    cwe: [CWE-78]
    owasp: "A03:2021"
    title: "Shell command built from non-constant input"
    message: "Command execution functions with non-constant input enable injection."
    pattern-either:
      - "exec($X, ...)"
      - "shell_exec($X)"
      - "system($X, ...)"
      - "passthru($X, ...)"
      - "popen($X, ...)"
      - "proc_open($X, ...)"
    where:
      - {metavariable: X, kind: not_literal}
    fix: "Use escapeshellarg() on every argument or avoid the shell."
    tests: {vulnerable: [vuln.php], safe: [safe.php]}

  - id: php-include-request
    stack: generic
    languages: [php]
    severity: high
    confidence: medium
    cwe: [CWE-98]
    owasp: "A03:2021"
    title: "File inclusion controlled by the request"
    message: "include/require with request data allows local or remote file inclusion."
    pattern-either:
      - "include $X;"
      - "include_once $X;"
      - "require $X;"
      - "require_once $X;"
    where:
      - {metavariable: X, kind: regex, regex: "\\$_(GET|POST|REQUEST|COOKIE|FILES)\\b"}
    fix: "Map user input to an allowlist of files."
    tests: {vulnerable: [vuln.php], safe: [safe.php]}

  - id: php-weak-hash
    stack: generic
    languages: [php]
    severity: medium
    confidence: low
    cwe: [CWE-328]
    owasp: "A02:2021"
    title: "Weak hash algorithm"
    message: "md5/sha1 are broken for security purposes. Only appropriate for non-security checksums."
    pattern-either:
      - "md5($X)"
      - "sha1($X)"
    fix: "Use password_hash for passwords and hash('sha256', ...) otherwise."
    tests: {vulnerable: [vuln.php], safe: [safe.php]}

  - id: php-sql-interp
    stack: generic
    languages: [php]
    severity: high
    confidence: medium
    cwe: [CWE-89]
    owasp: "A03:2021"
    title: "SQL built with string interpolation"
    message: "A query assembled by interpolation or concatenation is injectable. Use prepared statements."
    pattern-either:
      - "mysqli_query($C, $Q)"
      - "pg_query($C, $Q)"
      - "mysql_query($Q)"
      - "$DB->query($Q)"
      - "$DB->exec($Q)"
    where:
      - {metavariable: Q, kind: fstring_or_concat}
    fix: "Use prepared statements with bound parameters."
    tests: {vulnerable: [vuln.php], safe: [safe.php]}

  - id: php-echo-request
    stack: generic
    languages: [php]
    severity: medium
    confidence: medium
    cwe: [CWE-79]
    owasp: "A03:2021"
    title: "Request data echoed without escaping"
    message: "Echoing request data directly enables reflected XSS."
    pattern-either:
      - "echo $_GET[$K];"
      - "echo $_POST[$K];"
      - "echo $_REQUEST[$K];"
    fix: "Escape with htmlspecialchars($value, ENT_QUOTES, 'UTF-8')."
    tests: {vulnerable: [vuln.php], safe: [safe.php]}
