rules:
  - id: js-eval
    stack: generic
    languages: [javascript, typescript, tsx]
    severity: high
    confidence: medium
    cwe: [CWE-95]
    owasp: "A03:2021"
    title: "Use of eval()"
    message: "eval() executes arbitrary code. Avoid it with non-constant input."
    pattern: "eval($X)"
    where:
      - {metavariable: X, kind: not_literal}
    tests: {vulnerable: [vuln.js, vuln.ts], safe: [safe.js]}

  - id: js-function-constructor
    stack: generic
    languages: [javascript, typescript, tsx]
    severity: high
    confidence: medium
    cwe: [CWE-95]
    owasp: "A03:2021"
    title: "Function constructor with non-constant body"
    message: "new Function(body) compiles code from a string."
    pattern: "new Function(..., $X)"
    where:
      - {metavariable: X, kind: not_literal}
    tests: {vulnerable: [vuln.js], safe: [safe.js]}

  - id: js-exec
    stack: generic
    languages: [javascript, typescript, tsx]
    severity: high
    confidence: medium
    cwe: [CWE-78]
    owasp: "A03:2021"
    title: "Shell command built from non-constant input"
    message: "child_process.exec runs a shell; a non-constant command enables injection."
    pattern-either:
      - "child_process.exec($X, ...)"
      - "child_process.execSync($X, ...)"
      - "exec($X, ...)"
      - "execSync($X, ...)"
    where:
      - {metavariable: X, kind: not_literal}
    fix: "Use execFile/spawn with an argument array."
    tests: {vulnerable: [vuln.js, vuln.ts], safe: [safe.js]}

  - id: js-innerhtml-assign
    stack: generic
    languages: [javascript, typescript, tsx]
    severity: medium
    confidence: medium
    cwe: [CWE-79]
    owasp: "A03:2021"
    title: "HTML injection through innerHTML/outerHTML"
    message: "innerHTML receives a string built with interpolated values that are not visibly escaped."
    pattern-either:
      - "$EL.innerHTML = $X"
      - "$EL.innerHTML += $X"
      - "$EL.outerHTML = $X"
    where:
      - {metavariable: X, kind: unsafe_interpolation}
    fix: "Escape every interpolated value (escapeHtml), use textContent, or sanitize with DOMPurify."
    tests: {vulnerable: [vuln.js, vuln.ts], safe: [safe.js]}

  - id: js-innerhtml-var
    stack: generic
    languages: [javascript, typescript, tsx]
    severity: medium
    confidence: low
    cwe: [CWE-79]
    owasp: "A03:2021"
    title: "innerHTML assigned from a variable or call"
    message: "innerHTML receives a non-constant value; check that it was escaped where it was built."
    pattern-either:
      - "$EL.innerHTML = $X"
      - "$EL.innerHTML += $X"
      - "$EL.outerHTML = $X"
    where:
      - {metavariable: X, kind: not_literal}
      - {metavariable: X, kind: not_fstring_or_concat}
    fix: "Prefer textContent, or sanitize with DOMPurify before assigning."
    tests: {vulnerable: [vuln.js], safe: [safe.js]}

  - id: js-document-write
    stack: generic
    languages: [javascript, typescript, tsx]
    severity: medium
    confidence: medium
    cwe: [CWE-79]
    owasp: "A03:2021"
    title: "document.write with non-constant data"
    message: "document.write with dynamic data can inject script."
    pattern-either:
      - "document.write($X)"
      - "document.writeln($X)"
    where:
      - {metavariable: X, kind: not_literal}
    tests: {vulnerable: [vuln.js], safe: [safe.js]}

  - id: js-dangerous-html
    stack: generic
    languages: [javascript, tsx]
    severity: high
    confidence: medium
    cwe: [CWE-79]
    owasp: "A03:2021"
    title: "dangerouslySetInnerHTML with unsanitized data"
    message: "dangerouslySetInnerHTML renders raw HTML; non-constant, unsanitized data enables XSS."
    pattern-either:
      - "<$T ... dangerouslySetInnerHTML={{ __html: $X }} ... />"
      - "<$T ... dangerouslySetInnerHTML={{ __html: $X }} ...></$T>"
    where:
      - {metavariable: X, kind: not_literal}
      - {metavariable: X, kind: not_regex, regex: "^(DOMPurify\\.sanitize|sanitizeHtml|sanitize|xss)\\("}
    fix: "Sanitize with DOMPurify.sanitize(...) or render text."
    tests: {vulnerable: [vuln.tsx], safe: [safe.tsx]}

  - id: js-xss
    stack: generic
    languages: [javascript, typescript, tsx]
    severity: medium
    confidence: medium
    cwe: [CWE-79]
    owasp: "A03:2021"
    title: "Angular sanitizer bypass with non-constant data"
    message: "bypassSecurityTrust* disables Angular's built-in sanitisation; non-constant data enables XSS."
    pattern-either:
      - "$S.bypassSecurityTrustHtml($X)"
      - "$S.bypassSecurityTrustScript($X)"
      - "$S.bypassSecurityTrustStyle($X)"
      - "$S.bypassSecurityTrustUrl($X)"
      - "$S.bypassSecurityTrustResourceUrl($X)"
    where:
      - {metavariable: X, kind: not_literal}
    fix: "Do not bypass the sanitizer; render text or sanitise with DOMPurify first."
    tests: {vulnerable: [vuln.ts], safe: [safe.ts]}

  - id: js-tls-verify-disabled
    stack: generic
    languages: [javascript, typescript, tsx]
    severity: high
    confidence: high
    cwe: [CWE-295]
    owasp: "A02:2021"
    title: "TLS certificate verification disabled"
    message: "Certificate validation is turned off, allowing man-in-the-middle attacks."
    pattern-either:
      - "new $C({ ..., rejectUnauthorized: false, ... })"
      - "$F({ ..., rejectUnauthorized: false, ... })"
      - "$F($A, { ..., rejectUnauthorized: false, ... })"
      - "process.env.NODE_TLS_REJECT_UNAUTHORIZED = '0'"
      - "process.env.NODE_TLS_REJECT_UNAUTHORIZED = \"0\""
    fix: "Trust the right CA (NODE_EXTRA_CA_CERTS) instead of disabling verification."
    tests: {vulnerable: [vuln.js], safe: [safe.js]}

  - id: js-cookie-insecure
    stack: generic
    languages: [javascript, typescript, tsx]
    severity: medium
    confidence: high
    cwe: [CWE-1004, CWE-614]
    owasp: "A05:2021"
    title: "Cookie set without HttpOnly/Secure"
    message: "The cookie options explicitly disable httpOnly or secure."
    pattern-either:
      - "$R.cookie($N, $V, { ..., httpOnly: false, ... })"
      - "$R.cookie($N, $V, { ..., secure: false, ... })"
      - "session({ ..., cookie: { ..., secure: false, ... }, ... })"
      - "session({ ..., cookie: { ..., httpOnly: false, ... }, ... })"
    fix: "Set httpOnly: true and secure: true (and sameSite) for session cookies."
    tests: {vulnerable: [vuln.js], safe: [safe.js]}

  - id: js-cors-wildcard-credentials
    stack: generic
    languages: [javascript, typescript, tsx]
    severity: medium
    confidence: medium
    cwe: [CWE-942]
    owasp: "A05:2021"
    title: "CORS allows any origin with credentials"
    message: "Reflecting any origin (or '*') together with credentials lets any site read authenticated responses."
    pattern-either:
      - "cors({ ..., origin: true, ..., credentials: true, ... })"
      - "cors({ ..., credentials: true, ..., origin: true, ... })"
      - "cors({ ..., origin: '*', ..., credentials: true, ... })"
      - "cors({ ..., credentials: true, ..., origin: '*', ... })"
    fix: "Allow-list explicit origins when credentials are enabled."
    tests: {vulnerable: [vuln.js], safe: [safe.js]}

  - id: js-jwt-insecure
    stack: generic
    languages: [javascript, typescript, tsx]
    severity: high
    confidence: high
    cwe: [CWE-347]
    owasp: "A02:2021"
    title: "JWT verified with no algorithm restriction or with 'none'"
    message: "Accepting the 'none' algorithm (or decoding without verification) lets attackers forge tokens."
    pattern-either:
      - "jwt.verify($T, $S, { ..., algorithms: ['none'], ... })"
      - "jwt.verify($T, $S, { ..., ignoreExpiration: true, ... })"
    fix: "Pin algorithms (e.g. ['HS256']) and do not ignore expiry."
    tests: {vulnerable: [vuln.js], safe: [safe.js]}
