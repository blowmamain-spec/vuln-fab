name: "vulnfab"
description: "Multi-stack static security scanner (Supabase, Django, Laravel, TypeScript). Uploads SARIF to code scanning."
author: "vulnfab"
branding:
  icon: "shield"
  color: "blue"

inputs:
  path:
    description: "Directory to scan."
    default: "."
  fail-on:
    description: "Fail the job when a finding of at least this severity exists (critical|high|medium|low|info). Empty = never fail."
    default: ""
  min-confidence:
    description: "Hide findings below this confidence (high|medium|low)."
    default: "medium"
  since:
    description: "Git ref for diff mode. Defaults to the PR base on pull_request events (needs fetch-depth: 0)."
    default: ""
  upload-sarif:
    description: "Upload the SARIF file to GitHub code scanning."
    default: "true"
  sarif-file:
    description: "Where to write the SARIF file."
    default: "vulnfab.sarif"
  extra-args:
    description: "Extra arguments for `vulnfab scan`."
    default: ""

outputs:
  exit-code:
    description: "vulnfab exit code (0 clean, 1 findings, 2 usage, 3 internal)."
    value: ${{ steps.scan.outputs.exit-code }}
  sarif-file:
    description: "Path of the SARIF file."
    value: ${{ steps.scan.outputs.sarif-file }}

runs:
  using: "composite"
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: "3.11"
    - name: Install vulnfab
      shell: bash
      run: python -m pip install --quiet "${{ github.action_path }}"
    - name: Scan
      id: scan
      shell: bash
      env:
        VULNFAB_PATH: ${{ inputs.path }}
        VULNFAB_FAIL_ON: ${{ inputs.fail-on }}
        VULNFAB_MIN_CONF: ${{ inputs.min-confidence }}
        VULNFAB_SINCE: ${{ inputs.since != '' && inputs.since || (github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || '') }}
        VULNFAB_SARIF: ${{ inputs.sarif-file }}
        VULNFAB_EXTRA_ARGS: ${{ inputs.extra-args }}
      run: bash "${{ github.action_path }}/scripts/action-run.sh"
    - name: Upload SARIF
      if: ${{ inputs.upload-sarif == 'true' && steps.scan.outputs.exit-code != '' && steps.scan.outputs.exit-code < 2 }}
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: ${{ steps.scan.outputs.sarif-file }}
        category: vulnfab
    - name: Fail on findings or errors
      if: ${{ steps.scan.outputs.exit-code != '0' }}
      shell: bash
      run: exit ${{ steps.scan.outputs.exit-code }}
